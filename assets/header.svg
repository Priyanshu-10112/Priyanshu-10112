  <title id="title">Priyanshu Sharma — Engineering the next move</title>
  <desc id="desc">Java backend developer building APIs, real-time systems and computer vision projects. SIH 2025 Winner and AWS Certified Cloud Practitioner. A geometric rook stands on a chessboard, connected by an illuminated move path.</desc>
